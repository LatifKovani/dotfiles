# generated by tide-theme (Gruvbox Material) - edit the template, not this file
# Message style
set -g message-style "fg=yellow,bg=default"
set -g message-command-style "fg=yellow,bg=default"

# Pane style
set -g pane-border-style "fg=#040405"
set -g pane-active-border-style "fg=#040405"
set-window-option -g pane-border-status off

# Status bar style
set -g status-style "fg=yellow,bg=default"
set -g status-left "#[fg=#d4be98,bg=default]#[fg=#040405,bg=#d4be98] #{session_windows}#[fg=#d4be98,bg=default]  "
set -g status-right "#[fg=#d4be98,bg=default] #S #[fg=#d4be98,bg=default] #[fg=#040405,bg=#d4be98]󱫋 #{session_attached}#[fg=#d4be98,bg=default]"

# Window style
set -g window-status-style "fg=#d4be98,bg=default"
set -g window-status-format "#[fg=default,bg=default] #[fg=default,bg=default]#W"
set -g window-status-separator "  "
set -g window-status-current-format "#[fg=#e78a4e,bg=default]  #[fg=#d4be98,bg=default]#W"
