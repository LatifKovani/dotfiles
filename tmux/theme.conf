# generated by tide-theme (Kanagawa) - edit the template, not this file
# Message style
set -g message-style "fg=yellow,bg=default"
set -g message-command-style "fg=yellow,bg=default"

# Pane style
set -g pane-border-style "fg=#040405"
set -g pane-active-border-style "fg=#040405"
set-window-option -g pane-border-status off

# Status bar style
set -g status-style "fg=yellow,bg=default"
set -g status-left "#[fg=#dcd7ba,bg=default]#[fg=#040405,bg=#dcd7ba] #{session_windows}#[fg=#dcd7ba,bg=default]  "
set -g status-right "#[fg=#dcd7ba,bg=default] #S #[fg=#dcd7ba,bg=default] #[fg=#040405,bg=#dcd7ba]󱫋 #{session_attached}#[fg=#dcd7ba,bg=default]"

# Window style
set -g window-status-style "fg=#dcd7ba,bg=default"
set -g window-status-format "#[fg=default,bg=default] #[fg=default,bg=default]#W"
set -g window-status-separator "  "
set -g window-status-current-format "#[fg=#ffa066,bg=default]  #[fg=#dcd7ba,bg=default]#W"
