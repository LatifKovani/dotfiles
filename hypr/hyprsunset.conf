# ~/.config/hypr/hyprsunset.conf

# Optional: Set a global maximum for the gamma value. The absolute max is 200%.
# This is useful if you want to control the brightness with keybinds.
max-gamma = 150

# Profile for daytime: neutral colors, normal brightness.
profile {
    time = 7:30          # Activation time (24-hour format)
    identity = true      # Ignores the temperature setting, reverts to a normal screen.
    gamma = 1.0          # Normal brightness (100%)
}

# Profile for evening: warmer colors, slightly dimmer.
profile {
    time = 19:00
    temperature = 5000   # Lower number = warmer (more orange/red). Default is 6000.
    gamma = 0.9
}

# Profile for night: very warm, even dimmer.
profile {
    time = 23:00
    temperature = 4000
    gamma = 0.8
}
