monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor= HDMI-A0, preferred, auto, 1 # join 2 monitors
# monitor=HDMI-A-1,preferred,auto,1,mirror,eDP-1 # mirror monitors

exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = ags run ~/.config/ags/bar/app.ts
exec-once = wlsunset -l 42.6 -L 21.1 -t 3700
exec = swaybg -m fill -i ~/Pictures/Orange-1,Orange-2/Orange-2.png
exec-once = /usr/local/bin/hp-camera-fix.sh
exec-once = hyprpm reload -n
exec-once = wl-paste --type text --watch cliphist store
exec-once = walker --gapplication-service
exec-once = elephant

$fileManager = nautilus
$appLauncher = nc -U /run/user/1000/walker/walker.sock
$terminal = kitty
$browser = brave
$logout = wlogout --protocol layer-shell
$closeWindow = forcekillactive
$office = onlyoffice-desktopeditors
$lockScreen = swaylock -p --config ~/.config/swaylock/config
$exitHyprland = exit
$notificationCentre = ags request 'toggleNc' -i bar
$nightMode = ~/.local/bin/toggle-wlsunset.fish
$screenPrint = grim -g "$(slurp)" /tmp/screenshot.png && wl-copy --type image/png < /tmp/screenshot.png && satty --filename /tmp/screenshot.png
$windowScreenshot = bind = $mainMod, P, exec, sleep 0.3 && grim /tmp/screenshot.png && wl-copy --type image/png < /tmp/screenshot.png && satty --filename /tmp/screenshot.png
$clipboardHistory = cliphist list | walker --dmenu -p "Search Clipboard" | cliphist decode | wl-copy
$clearClipboard = cliphist wipe

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0
}

plugin {
    hyprscrolling {
        column_width = 0.6
        fullscreen_on_one_column = true
        explicit_column_widths = 0.5, 0.67, 0.8, 1.0
        follow_focus = true
    }
}

general {
    gaps_in = 2
    gaps_out = 5 0 0 0
    border_size = 1
    col.active_border = rgba(ECEFF460)
    col.inactive_border = rgba(595959aa)
    layout = scrolling
}

misc {
    disable_hyprland_logo = yes
}

decoration {
    rounding = 17
    blur {
        enabled = yes
        size = 8
        passes = 3
        ignore_opacity = true
        contrast = 2
        xray = false
        new_optimizations = true
        brightness = 0.8
    }
}

animations {
    enabled = yes
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
    new_on_top = true
    mfact = 0.5
}

# ── Layer rules ────────────────────────────────────────────────────────────────

layerrule {
    name = wlogout-blur
    match:namespace = logout_dialog
    blur = true
    ignore_alpha = true
}

# AGS bar / NC panel blur
layerrule {
    name = ags-blur
    match:namespace = gtk-layer-shell
    blur = true
    ignore_alpha = 0.2
}
layerrule {
    name = ags-nc
    match:namespace = gtk-layer-shell
    ignore_alpha = 0.1
}

# ── Keybindings ────────────────────────────────────────────────────────────────

$mainMod = SUPER

bind = $mainMod, T, submap, layout
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, O, exec, $office
bind = $mainMod SHIFT, X, $closeWindow
bind = $mainMod SHIFT, U, exec, $lockScreen
bind = $mainMod, M, exec, $logout
bind = $mainMod SHIFT, M, $exitHyprland
bind = $mainMod, B, exec, $browser
bind = $mainMod, SPACE, exec, $appLauncher
bind = $mainMod, S, exec, $screenPrint
bind = $mainMod, W, exec, $windowScreenshot
bind = $mainMod, N, exec, $nightMode
bind = $mainMod, R, exec, $notificationCentre
bind = $mainMod SHIFT, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, C, exec, $clipboardHistory
bind = $mainMod SHIFT, C, exec, $clearClipboard

# ── ASUS specific keys ─────────────────────────────────────────────────────────
bind = ,237, exec, brightnessctl -d asus::kbd_backlight set 20%-     # KB brightness down FN+F2
bind = ,238, exec, brightnessctl -d asus::kbd_backlight set 20%+     # KB brightness up FN+F3
bind = ,210, exec, asusctl led-mode -n                               # KB RGB profile FN+F4
bind = ,156, exec, rog-control-center                                # ASUS Armory crate key

# ── Volume ─────────────────────────────────────────────────────────────────────
bind = ,XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── Brightness ─────────────────────────────────────────────────────────────────
bind = ,XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Media ──────────────────────────────────────────────────────────────────────
bind = ,XF86AudioPlay,         exec, playerctl play-pause
bind = ,XF86AudioNext,         exec, playerctl next
bind = ,XF86AudioPrev,         exec, playerctl previous

# ── Scrolling layout ───────────────────────────────────────────────────────────
bind = $mainMod, period,  layoutmsg, move +col
bind = $mainMod, comma,   layoutmsg, move -col
bind = $mainMod, equal,   layoutmsg, colresize +0.1
bind = $mainMod, minus,   layoutmsg, colresize -0.1

bind = $mainMod SHIFT, period, layoutmsg, movewindowto r
bind = $mainMod SHIFT, comma,  layoutmsg, movewindowto l
bind = $mainMod SHIFT, f,      layoutmsg, togglefit
bind = CTRL, 1, layoutmsg, movecoltoworkspace 1
bind = CTRL, 2, layoutmsg, movecoltoworkspace 2

bind = $mainMod SHIFT, h, layoutmsg, movewindowto l
bind = $mainMod SHIFT, j, layoutmsg, movewindowto r
bind = $mainMod SHIFT, k, layoutmsg, movewindowto u
bind = $mainMod SHIFT, l, layoutmsg, movewindowto d

# ── Focus ──────────────────────────────────────────────────────────────────────
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, d

# ── Workspaces ─────────────────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Mouse ──────────────────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:273, resizewindow

# ── Layout submap ──────────────────────────────────────────────────────────────
submap = layout
bind = , D, exec, hyprctl keyword general:layout dwindle
bind = , D, submap, reset
bind = , S, exec, hyprctl keyword general:layout scrolling
bind = , S, submap, reset
bind = , escape, submap, reset
submap = reset
