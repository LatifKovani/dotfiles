# ~/.config/hypr/hyprlock.conf

# colour variables written by tide-theme
source = ~/.config/hypr/theme-hyprlock.conf

background {
    monitor =
    path = ~/Pictures/Wallpapers/DuoNight+2.png
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
}

# Profile-Photo
image {
    monitor =
    path = ~/Pictures/IMG_9869_cropped.png
    size = 70
    rounding = -1
    border_size = 0
    position = 0, 200
    halign = center
    valign = bottom
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $tide_fg_text
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, 350
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $tide_fg_text
    font_size = 110
    font_family = SF Pro Display Bold
    position = 0, 250
    halign = center
    valign = center
}

# USER
label {
    text = $USER 
    color = $tide_fg
    font_size = 13
    font_family = SF Pro Display 
    position = 0, -370
    halign = center
    valign = center
}

label {
    text = $FPRINTPROMPT
    color = $tide_fg_soft
    font_size = 13
    font_family = SF Pro Display Regular 
    position = 0, -420
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 45
    rounding = 50
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $tide_input_outer
    inner_color = $tide_input_inner
    font_color = $tide_input_font
    fade_on_empty = true
    fade_timeout = 1000
    font_family = SF Pro Display Regular 
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    hide_input = false
    position = 0, -470
    halign = center
    valign = center
    check_color = $tide_input_check
    fail_color = $tide_input_fail
}

auth {
    fingerprint {
        enabled = true
        ready_message = Touch ID or Enter Password
        present_message = Scanning...
        retry_delay = 250
    }
}
